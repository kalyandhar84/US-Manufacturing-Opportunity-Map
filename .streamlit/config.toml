[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#F7F4EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C2430"
linkColor = "#1F4E79"
borderColor = "#D9D0C2"
showWidgetBorder = true
showSidebarBorder = true
font = "sans serif"
baseRadius = "4px"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#1F4E79", "#B45309", "#3F6F4A", "#0F766E", "#7C3AED", "#9A3412", "#57534E"]

[theme.sidebar]
backgroundColor = "#F1EBDD"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#D9D0C2"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
