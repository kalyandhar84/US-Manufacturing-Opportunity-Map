[theme]
base = "light"
primaryColor = "#2B6CB0"
backgroundColor = "#F7FBFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2332"
linkColor = "#1D4E89"
borderColor = "#D7E6F4"
showWidgetBorder = true
showSidebarBorder = true
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["34px", "26px", "20px", "16px", "14px", "12px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
linkUnderline = false
dataframeBorderColor = "#D7E6F4"
dataframeHeaderBackgroundColor = "#E8F3FC"
chartCategoricalColors = ["#2B6CB0", "#3B82C4", "#0F766E", "#0284C7", "#6366F1", "#1D4E89", "#64748B"]
chartSequentialColors = ["#F7FBFF", "#E8F3FC", "#D6EAF8", "#B8D4EA", "#93C5FD", "#60A5FA", "#3B82C4", "#2B6CB0", "#1D4E89", "#163A66"]
redColor = "#B42318"
orangeColor = "#D97706"
yellowColor = "#CA8A04"
greenColor = "#2F6A45"
blueColor = "#2B6CB0"
violetColor = "#6366F1"
grayColor = "#4A5A6A"

[theme.sidebar]
backgroundColor = "#E8F3FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2332"
borderColor = "#D7E6F4"
primaryColor = "#2B6CB0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
enableCORS = false
enableXsrfProtection = true
