[theme]
base = "light"
primaryColor = "#15456B"
backgroundColor = "#F3EFE4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15202B"
linkColor = "#15456B"
borderColor = "#D6CCBB"
showWidgetBorder = true
showSidebarBorder = true
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["34px", "26px", "20px", "16px", "14px", "12px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
linkUnderline = false
dataframeBorderColor = "#D6CCBB"
dataframeHeaderBackgroundColor = "#EDE6D6"
chartCategoricalColors = ["#15456B", "#A84812", "#2F6A45", "#0F766E", "#6D28D9", "#9A3412", "#57534E"]
redColor = "#B42318"
orangeColor = "#A84812"
yellowColor = "#B45309"
greenColor = "#2F6A45"
blueColor = "#15456B"
violetColor = "#6D28D9"
grayColor = "#4A5866"

[theme.sidebar]
backgroundColor = "#E6DCC8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15202B"
borderColor = "#D0C4B0"
primaryColor = "#15456B"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
enableCORS = false
enableXsrfProtection = true
